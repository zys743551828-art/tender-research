[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tender-research"
version = "1.0.0"
description = "施组投标诊断的研究与验证程序：规则证据检索、诊断、评分回测与大模型评测"
requires-python = ">=3.11"
dependencies = [
  "pypdf==6.10.0",
  "pdfplumber==0.11.9",
  "pdfminer.six==20251230",
  "pypdfium2==5.13.0",
  "pydantic==2.13.5",
  "numpy==2.3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]
# 原件对象存储（阿里云 OSS 等 S3 兼容服务）
store = ["boto3==1.40.76"]

[tool.hatch.build.targets.wheel]
packages = ["src/tender_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
# 显式列出规则集，不随 ruff 版本的默认集合变化。
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "BLE", "PLW1510"]
ignore = [
  "E701", "E702",  # 代码风格允许短语句同行（如 `a; b`、`if x: continue`），不影响可读性约定
  "B905",          # zip 的各序列长度由构造保证一致，不逐处加 strict=
]

[tool.ruff.lint.per-file-ignores]
# 先关闭网络与追踪的环境变量和 socket 补丁，再导入编排依赖，导入顺序是有意的。
# 编排检查把任意异常记为失败项继续执行后续检查，捕获 Exception 是有意的。
"scripts/orchestration_check.py" = ["E402", "BLE001"]
